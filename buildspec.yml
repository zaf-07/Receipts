version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-west-2
    IMAGE_REPO_NAME: receipts
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - IMAGE_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${IMAGE_URI}
  build:
    commands:
      - docker build --tag ${IMAGE_REPO_NAME}:${IMAGE_TAG} .
      - docker tag ${IMAGE_REPO_NAME}:${IMAGE_TAG} ${IMAGE_URI}:${IMAGE_TAG}
  post_build:
    commands:
      - docker push ${IMAGE_URI}:${IMAGE_TAG}
